<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onwayy Cargo · Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/admin.css" />
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">ONWAYY</span>
        <span class="brand-sub">CARGO · ADMIN</span>
      </div>
      <h5 class="mb-3 text-center">Sign in to continue</h5>
      <div id="loginError" class="alert alert-danger py-2 d-none"></div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input id="username" class="form-control" placeholder="admin" autocomplete="username" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button id="loginBtn" class="btn btn-danger w-100">Login</button>
      <!-- <p class="text-muted small mt-3 mb-0 text-center">Default: admin / admin123</p> -->
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" class="d-none">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">ONWAYY</span>
        <span class="brand-sub">CARGO</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" data-view="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="#gallery" data-view="gallery"><i class="bi bi-images"></i> Gallery</a>
        <a href="#team" data-view="team"><i class="bi bi-people"></i> Team</a>
        <a href="#blogs" data-view="blogs"><i class="bi bi-journal-text"></i> Blogs</a>
        <a href="#contacts" data-view="contacts"><i class="bi bi-envelope"></i> Contact Leads <span id="badgeContacts" class="badge bg-danger ms-auto d-none">0</span></a>
        <a href="#quotes" data-view="quotes"><i class="bi bi-calculator"></i> Quote Requests <span id="badgeQuotes" class="badge bg-danger ms-auto d-none">0</span></a>
      </nav>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <button id="menuToggle" class="btn btn-sm btn-light d-lg-none"><i class="bi bi-list"></i></button>
        <h4 id="viewTitle" class="mb-0">Dashboard</h4>
        <span class="ms-auto text-muted small">Signed in as <strong id="whoami">admin</strong></span>
      </header>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <!-- Generic modal -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Edit</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="app-toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
